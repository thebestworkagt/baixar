<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love - Afro Zouk Beat</title>

    <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo1.png">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* ===== RESET E BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0f;
            background-image: 
                radial-gradient(ellipse at 20% 50%, rgba(106, 13, 173, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(255, 45, 120, 0.10) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(106, 13, 173, 0.08) 0%, transparent 40%);
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* ===== PARTÍCULAS DE FUNDO ===== */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(167, 139, 250, 0.3);
            border-radius: 50%;
            animation: floatParticle linear infinite;
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1);
                opacity: 0;
            }
        }

        /* ===== CARD PRINCIPAL ===== */
        .beat-card {
            position: relative;
            z-index: 1;
            max-width: 520px;
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 40px 35px 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 
                0 30px 80px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease;
        }

        .beat-card:hover {
            transform: translateY(-2px);
        }

        /* ===== CAPA DO BEAT ===== */
        .cover-wrapper {
            position: relative;
            width: 100%;
            max-width: 320px;
            margin: 0 auto 28px;
            aspect-ratio: 1/1;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 
                0 20px 60px rgba(106, 13, 173, 0.3),
                0 0 80px rgba(106, 13, 173, 0.15);
        }

        .cover-wrapper::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 22px;
            padding: 2px;
            background: linear-gradient(135deg, rgba(167, 139, 250, 0.3), rgba(255, 45, 120, 0.2), rgba(167, 139, 250, 0.3));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .cover-wrapper .cover-glow {
            position: absolute;
            inset: -30%;
            background: radial-gradient(circle at 50% 50%, rgba(167, 139, 250, 0.2), transparent 70%);
            animation: pulseGlow 3s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        .cover-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: relative;
            z-index: 1;
            display: block;
        }

        /* ===== CAPA FICTÍCIA (se não tiver imagem) ===== */
        .cover-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a0a2e, #2d1b4e, #1a0a2e);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1;
            color: white;
        }

        .cover-placeholder .icon-big {
            font-size: 64px;
            color: rgba(167, 139, 250, 0.4);
            margin-bottom: 12px;
        }

        .cover-placeholder .title-art {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 4px;
        }

        .cover-placeholder .sub-art {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-top: 4px;
        }

        /* ===== INFORMAÇÕES ===== */
        .beat-info {
            text-align: center;
            margin-bottom: 24px;
        }

        .beat-name {
            font-size: 38px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 30%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            margin-bottom: 6px;
            text-shadow: 0 0 40px rgba(167, 139, 250, 0.15);
        }

        .beat-tags {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            background: rgba(167, 139, 250, 0.12);
            border: 1px solid rgba(167, 139, 250, 0.15);
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
        }

        .tag i {
            font-size: 11px;
            color: #a78bfa;
        }

        .tag.key-tag {
            background: rgba(251, 191, 36, 0.08);
            border-color: rgba(251, 191, 36, 0.15);
            color: rgba(251, 191, 36, 0.6);
        }

        .tag.key-tag i {
            color: #fbbf24;
        }

        /* ===== PLAYER ===== */
        .player-wrapper {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 18px 20px 16px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .play-btn {
            width: 48px;
            height: 48px;
            min-width: 48px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #7c3aed, #a78bfa);
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .play-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 30px rgba(124, 58, 237, 0.4);
        }

        .play-btn:active {
            transform: scale(0.95);
        }

        .play-btn.playing {
            background: linear-gradient(135deg, #f472b6, #ec4899);
            box-shadow: 0 4px 20px rgba(236, 72, 153, 0.3);
        }

        .player-info {
            flex: 1;
            min-width: 0;
        }

        .player-time {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
            font-weight: 500;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            transition: height 0.2s ease;
        }

        .progress-bar:hover {
            height: 6px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            border-radius: 4px;
            background: linear-gradient(90deg, #7c3aed, #a78bfa);
            transition: width 0.1s linear;
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            right: -4px;
            top: -4px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #a78bfa;
            opacity: 0;
            transition: opacity 0.2s ease;
            box-shadow: 0 0 20px rgba(167, 139, 250, 0.4);
        }

        .progress-bar:hover .progress-fill::after {
            opacity: 1;
        }

        /* ===== VISUALIZER ===== */
        .visualizer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            height: 30px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        .visualizer .bar {
            width: 4px;
            height: 8px;
            background: rgba(167, 139, 250, 0.2);
            border-radius: 2px;
            transition: height 0.15s ease;
        }

        .visualizer.active .bar {
            background: linear-gradient(to top, #7c3aed, #a78bfa);
            animation: visualize 0.6s ease-in-out infinite alternate;
        }

        .visualizer .bar:nth-child(1) { animation-delay: 0.0s; }
        .visualizer .bar:nth-child(2) { animation-delay: 0.1s; }
        .visualizer .bar:nth-child(3) { animation-delay: 0.2s; }
        .visualizer .bar:nth-child(4) { animation-delay: 0.3s; }
        .visualizer .bar:nth-child(5) { animation-delay: 0.15s; }
        .visualizer .bar:nth-child(6) { animation-delay: 0.05s; }
        .visualizer .bar:nth-child(7) { animation-delay: 0.25s; }
        .visualizer .bar:nth-child(8) { animation-delay: 0.35s; }
        .visualizer .bar:nth-child(9) { animation-delay: 0.1s; }
        .visualizer .bar:nth-child(10) { animation-delay: 0.2s; }
        .visualizer .bar:nth-child(11) { animation-delay: 0.3s; }
        .visualizer .bar:nth-child(12) { animation-delay: 0.05s; }
        .visualizer .bar:nth-child(13) { animation-delay: 0.15s; }
        .visualizer .bar:nth-child(14) { animation-delay: 0.25s; }
        .visualizer .bar:nth-child(15) { animation-delay: 0.35s; }

        @keyframes visualize {
            0% { height: 6px; }
            100% { height: 28px; }
        }

        .visualizer .bar.inactive {
            height: 6px !important;
            animation: none !important;
        }

        /* ===== BOTÕES DE DOWNLOAD ===== */
        .download-section {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
        }

        .download-btn {
            flex: 1;
            padding: 14px 8px;
            border: none;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .download-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 14px;
            padding: 2px;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .btn-mp3 {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #fff;
            box-shadow: 0 4px 20px rgba(245, 158, 11, 0.25);
        }

        .btn-mp3:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(245, 158, 11, 0.35);
        }

        .btn-wav {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #fff;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.25);
        }

        .btn-wav:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(59, 130, 246, 0.35);
        }

        .download-btn:active {
            transform: scale(0.97);
        }

        .download-btn i {
            font-size: 16px;
        }

        /* ===== MODAL DE SENHA ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-box {
            background: rgba(20, 20, 35, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px 35px 35px;
            max-width: 400px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        .modal-box .modal-icon {
            text-align: center;
            font-size: 48px;
            color: #a78bfa;
            margin-bottom: 12px;
        }

        .modal-box h3 {
            color: #fff;
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 6px;
        }

        .modal-box p {
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            text-align: center;
            margin-bottom: 24px;
        }

        .modal-box .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .modal-box .input-group i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.2);
            font-size: 18px;
        }

        .modal-box input[type="password"] {
            width: 100%;
            padding: 14px 16px 14px 48px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            color: #fff;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
        }

        .modal-box input[type="password"]:focus {
            border-color: rgba(167, 139, 250, 0.4);
            background: rgba(255, 255, 255, 0.08);
        }

        .modal-box input[type="password"].error {
            border-color: #ef4444;
            animation: shake 0.4s ease;
        }

        .modal-box input[type="password"].success {
            border-color: #22c55e;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .modal-box .password-actions {
            display: flex;
            gap: 10px;
        }

        .modal-box .password-actions button {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-box .btn-confirm {
            background: linear-gradient(135deg, #7c3aed, #a78bfa);
            color: #fff;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.25);
        }

        .modal-box .btn-confirm:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(124, 58, 237, 0.35);
        }

        .modal-box .btn-cancel {
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.4);
        }

        .modal-box .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .modal-box .error-msg {
            color: #ef4444;
            font-size: 12px;
            text-align: center;
            margin-top: 12px;
            min-height: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-box .error-msg.show {
            opacity: 1;
        }

        /* ===== RODAPÉ ===== */
        .footer {
            text-align: center;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            margin-top: 4px;
        }

        .footer a {
            color: rgba(255, 255, 255, 0.25);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }

        .footer a:hover {
            color: rgba(167, 139, 250, 0.6);
        }

        .footer a i {
            margin-right: 6px;
            font-size: 12px;
        }

        /* ===== RESPONSIVO ===== */
        @media (max-width: 480px) {
            .beat-card {
                padding: 24px 18px 20px;
                border-radius: 24px;
            }

            .beat-name {
                font-size: 30px;
            }

            .cover-wrapper {
                max-width: 240px;
            }

            .download-section {
                flex-direction: column;
                gap: 8px;
            }

            .download-btn {
                padding: 16px;
            }

            .modal-box {
                padding: 30px 20px 25px;
            }

            .player-controls {
                gap: 12px;
            }

            .play-btn {
                width: 42px;
                height: 42px;
                min-width: 42px;
                font-size: 17px;
            }

            .tag {
                font-size: 10px;
                padding: 3px 10px;
            }

            .visualizer .bar {
                width: 3px;
            }
        }

        @media (max-width: 380px) {
            .beat-card {
                padding: 18px 12px 16px;
            }

            .beat-name {
                font-size: 26px;
            }

            .cover-wrapper {
                max-width: 180px;
            }

            .tag {
                font-size: 9px;
                padding: 2px 8px;
            }
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(167, 139, 250, 0.3);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(167, 139, 250, 0.5);
        }
    </style>
</head>
<body>

    <!-- ===== PARTÍCULAS ===== -->
    <div class="particles" id="particles"></div>

    <!-- ===== CARD PRINCIPAL ===== -->
    <div class="beat-card">

        <!-- CAPA -->
        <div class="cover-wrapper">
            <div class="cover-glow"></div>
            <div class="cover-placeholder">
                <div class="icon-big">♫</div>
                <div class="title-art">LOVE</div>
                <div class="sub-art">Afro Zouk</div>
            </div>
        </div>

        <!-- INFORMAÇÕES -->
        <div class="beat-info">
            <div class="beat-name">Love</div>
            <div class="beat-tags">
                <span class="tag"><i class="fas fa-music"></i> Afro-Zouk</span>
                <span class="tag"><i class="fas fa-tachometer-alt"></i> 90 BPM</span>
                <span class="tag key-tag"><i class="fas fa-key"></i> KEY: em breve</span>
            </div>
        </div>

        <!-- PLAYER -->
        <div class="player-wrapper">
            <div class="player-controls">
                <button class="play-btn" id="playBtn" aria-label="Play/Pause">
                    <i class="fas fa-play"></i>
                </button>
                <div class="player-info">
                    <div class="progress-bar" id="progressBar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="player-time">
                        <span id="currentTime">0:00</span>
                        <span id="totalTime">0:00</span>
                    </div>
                </div>
            </div>

            <!-- VISUALIZER -->
            <div class="visualizer" id="visualizer">
                <div class="bar inactive"></div>
                <div class="bar inactive"></div>
                <div class="bar inactive"></div>
                <div class="bar inactive"></div>
                <div class="bar inactive"></div>
                <div class="bar inactive"></div>
                <div class="bar inactive"></div>
                <div class="bar inactive"></div>
                <div class="bar inactive"></div>
                <div class="bar inactive"></div>
                <div class="bar inactive"></div>
                <div class="bar inactive"></div>
                <div class="bar inactive"></div>
                <div class="bar inactive"></div>
                <div class="bar inactive"></div>
            </div>
        </div>

        <!-- DOWNLOADS -->
        <div class="download-section">
            <button class="download-btn btn-mp3" data-format="mp3">
                <i class="fas fa-file-audio"></i> MP3
            </button>
            <button class="download-btn btn-wav" data-format="wav">
                <i class="fas fa-file-audio"></i> WAV
            </button>
        </div>

        <!-- RODAPÉ -->
        <div class="footer">
            <a href="https://bestbeats.vercel.app" target="_blank">
                <i class="fas fa-globe"></i> Nosso site: bestbeats.vercel.app
            </a>
        </div>
    </div>

    <!-- ===== MODAL DE SENHA ===== -->
    <div class="modal-overlay" id="passwordModal">
        <div class="modal-box">
            <div class="modal-icon"><i class="fas fa-lock"></i></div>
            <h3>Download Protegido</h3>
            <p>Digite a senha para liberar o download</p>

            <div class="input-group">
                <i class="fas fa-key"></i>
                <input type="password" id="passwordInput" placeholder="Digite a senha" autocomplete="off">
            </div>

            <div class="password-actions">
                <button class="btn-cancel" id="modalCancel">Cancelar</button>
                <button class="btn-confirm" id="modalConfirm">Confirmar</button>
            </div>

            <div class="error-msg" id="errorMsg">Senha incorreta. Tente novamente.</div>
        </div>
    </div>

    <!-- ===== ÁUDIO (OCULTO) ===== -->
    <audio id="audioPlayer" preload="metadata">
        <source src="https://od.lk/s/MzhfMzQ5NDYwNTJfODM3SXI/Play%20By%20-%20Beat%20Master.mp3" type="audio/mpeg">
    </audio>

    <script>
        // =====================================================
        // 1. PARTÍCULAS
        // =====================================================
        (function createParticles() {
            const container = document.getElementById('particles');
            const count = 40;
            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.width = (2 + Math.random() * 4) + 'px';
                p.style.height = p.style.width;
                p.style.animationDuration = (15 + Math.random() * 25) + 's';
                p.style.animationDelay = (Math.random() * 20) + 's';
                p.style.opacity = 0.2 + Math.random() * 0.3;
                container.appendChild(p);
            }
        })();

        // =====================================================
        // 2. PLAYER DE ÁUDIO
        // =====================================================
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const progressFill = document.getElementById('progressFill');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        const visualizer = document.getElementById('visualizer');
        const bars = visualizer.querySelectorAll('.bar');

        let isDragging = false;

        // Formata tempo
        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return m + ':' + (s < 10 ? '0' : '') + s;
        }

        // Atualiza barra de progresso
        function updateProgress() {
            if (!isDragging) {
                const percent = (audio.currentTime / audio.duration) * 100 || 0;
                progressFill.style.width = percent + '%';
                currentTimeEl.textContent = formatTime(audio.currentTime);
            }
        }

        // Carrega metadados
        audio.addEventListener('loadedmetadata', () => {
            totalTimeEl.textContent = formatTime(audio.duration);
        });

        // Atualiza tempo
        audio.addEventListener('timeupdate', updateProgress);

        // Play/Pause
        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play().catch(() => {});
            } else {
                audio.pause();
            }
        });

        audio.addEventListener('play', () => {
            playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            playBtn.classList.add('playing');
            visualizer.classList.add('active');
            bars.forEach(b => b.classList.remove('inactive'));
        });

        audio.addEventListener('pause', () => {
            playBtn.innerHTML = '<i class="fas fa-play"></i>';
            playBtn.classList.remove('playing');
            visualizer.classList.remove('active');
            bars.forEach(b => b.classList.add('inactive'));
        });

        audio.addEventListener('ended', () => {
            playBtn.innerHTML = '<i class="fas fa-play"></i>';
            playBtn.classList.remove('playing');
            visualizer.classList.remove('active');
            bars.forEach(b => b.classList.add('inactive'));
            progressFill.style.width = '0%';
            currentTimeEl.textContent = '0:00';
        });

        // Clique na barra de progresso
        progressBar.addEventListener('click', (e) => {
            const rect = progressBar.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audio.currentTime = percent * audio.duration;
        });

        // Arrastar na barra
        progressBar.addEventListener('mousedown', (e) => {
            isDragging = true;
            const rect = progressBar.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audio.currentTime = percent * audio.duration;
            updateProgress();

            const onMove = (ev) => {
                const r = progressBar.getBoundingClientRect();
                let p = (ev.clientX - r.left) / r.width;
                p = Math.max(0, Math.min(1, p));
                audio.currentTime = p * audio.duration;
                progressFill.style.width = (p * 100) + '%';
                currentTimeEl.textContent = formatTime(audio.currentTime);
            };

            const onUp = () => {
                isDragging = false;
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onUp);
            };

            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onUp);
        });

        // =====================================================
        // 3. SISTEMA DE DOWNLOAD COM SENHA (VIA API)
        // =====================================================
        let selectedFormat = null;

        const modal = document.getElementById('passwordModal');
        const passwordInput = document.getElementById('passwordInput');
        const errorMsg = document.getElementById('errorMsg');
        const modalConfirm = document.getElementById('modalConfirm');
        const modalCancel = document.getElementById('modalCancel');

        // Abre modal
        document.querySelectorAll('.download-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                selectedFormat = btn.dataset.format;
                passwordInput.value = '';
                passwordInput.className = '';
                errorMsg.classList.remove('show');
                modal.classList.add('active');
                setTimeout(() => passwordInput.focus(), 100);
            });
        });

        // Função para confirmar senha via API
        async function confirmPassword() {
            const password = passwordInput.value.trim();

            if (!password) {
                errorMsg.textContent = 'Digite a senha primeiro';
                errorMsg.classList.add('show');
                passwordInput.className = 'error';
                setTimeout(() => {
                    passwordInput.className = '';
                    errorMsg.classList.remove('show');
                }, 2000);
                return;
            }

            try {
                const response = await fetch('/api/download', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        password: password,
                        format: selectedFormat
                    })
                });

                const data = await response.json();

                if (data.success) {
                    // Senha correta - libera download
                    passwordInput.className = 'success';
                    errorMsg.classList.remove('show');

                    const link = document.createElement('a');
                    link.href = data.url;
                    link.download = data.filename;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    setTimeout(() => {
                        modal.classList.remove('active');
                        passwordInput.className = '';
                    }, 500);

                } else {
                    // Senha incorreta
                    passwordInput.className = 'error';
                    errorMsg.textContent = data.error || 'Senha incorreta';
                    errorMsg.classList.add('show');
                    passwordInput.value = '';
                    setTimeout(() => passwordInput.focus(), 100);

                    setTimeout(() => {
                        passwordInput.className = '';
                    }, 2000);
                }
            } catch (error) {
                errorMsg.textContent = 'Erro de conexão. Tente novamente.';
                errorMsg.classList.add('show');
                passwordInput.className = 'error';
                setTimeout(() => {
                    passwordInput.className = '';
                    errorMsg.classList.remove('show');
                }, 3000);
            }
        }

        modalConfirm.addEventListener('click', confirmPassword);

        passwordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                confirmPassword();
            }
        });

        modalCancel.addEventListener('click', () => {
            modal.classList.remove('active');
            passwordInput.className = '';
            errorMsg.classList.remove('show');
        });

        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.classList.remove('active');
                passwordInput.className = '';
                errorMsg.classList.remove('show');
            }
        });
    </script>

</body>
</html>

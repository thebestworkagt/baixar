<!DOCTYPE html>
<html lang="pt" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">Beatsao - Beat</title>
  
  <link rel="icon" type="image/png" href="logo1.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    /* ============================================================
       CSS - BEAT PAGE (capa centralizada)
       ============================================================ */
    :root {
      --bg-primary: #08080e;
      --bg-secondary: #12121a;
      --bg-card: rgba(20, 20, 30, 0.35);
      --text-primary: #f0f0f0;
      --text-secondary: #b5b5c8;
      --text-muted: #7a7a8a;
      --gold: #f7c948;
      --gold-dark: #f0a500;
      --gold-glow: rgba(247, 201, 72, 0.15);
      --border-color: rgba(247, 201, 72, 0.08);
      --border-hover: rgba(247, 201, 72, 0.2);
      --shadow: 0 20px 40px rgba(0,0,0,0.6);
      --radius: 40px;
      --radius-sm: 16px;
      --transition: 0.25s ease;
    }
    
    [data-theme="light"] {
      --bg-primary: #f0f0f0;
      --bg-secondary: #ffffff;
      --bg-card: rgba(255, 255, 255, 0.6);
      --text-primary: #0a0a0f;
      --text-secondary: #4a4a5a;
      --text-muted: #8a8a9a;
      --border-color: rgba(0, 0, 0, 0.08);
      --border-hover: rgba(0, 0, 0, 0.2);
      --shadow: 0 20px 40px rgba(0,0,0,0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg-primary);
      background-image: radial-gradient(circle at 10% 20%, var(--bg-secondary) 0%, var(--bg-primary) 90%);
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      color: var(--text-primary);
      transition: background 0.3s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
    }

    /* HEADER DO SITE */
    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: rgba(8, 8, 14, 0.92);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-color);
      padding: 0.8rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    [data-theme="light"] .site-header {
      background: rgba(240, 240, 240, 0.92);
    }
    .site-header .logo-area {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      text-decoration: none;
      color: var(--text-primary);
    }
    .site-header .logo-area img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--gold);
    }
    .site-header .logo-area .brand {
      font-size: 1.3rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .site-header .nav-links {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .site-header .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      transition: 0.2s;
      padding: 0.3rem 0.8rem;
      border-radius: 30px;
    }
    .site-header .nav-links a:hover {
      color: var(--gold);
      background: var(--gold-glow);
    }
    .site-header .nav-links .back-btn {
      background: var(--gold-glow);
      color: var(--gold);
      border: 1px solid var(--border-color);
    }
    .site-header .nav-links .back-btn:hover {
      background: var(--gold);
      color: #0a0a0f;
    }

    /* BEAT CARD */
    .beat-card {
      position: relative;
      z-index: 1;
      max-width: 520px;
      width: 100%;
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border-radius: 32px;
      padding: 40px 35px 30px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow);
      transition: transform 0.3s ease;
      margin-top: 80px;
    }
    .beat-card:hover {
      transform: translateY(-2px);
      border-color: var(--border-hover);
    }

    /* CAPA */
    .cover-wrapper {
      position: relative;
      width: 100%;
      max-width: 320px;
      margin: 0 auto 28px;
      aspect-ratio: 1/1;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(106, 13, 173, 0.3), 0 0 80px var(--gold-glow);
    }
    .cover-wrapper::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 22px;
      padding: 2px;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark), var(--gold));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    .cover-wrapper .cover-glow {
      position: absolute;
      inset: -30%;
      background: radial-gradient(circle at 50% 50%, var(--gold-glow), transparent 70%);
      animation: pulseGlow 3s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }
    .cover-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: relative;
      z-index: 1;
      display: block;
    }
    .cover-placeholder {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1a0a2e, #2d1b4e, #1a0a2e);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 1;
      color: white;
    }
    .cover-placeholder .icon-big {
      font-size: 64px;
      color: rgba(247, 201, 72, 0.4);
      margin-bottom: 12px;
    }
    .cover-placeholder .title-art {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 4px;
    }
    .cover-placeholder .sub-art {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.25);
      letter-spacing: 6px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* INFORMAÇÕES */
    .beat-info { text-align: center; margin-bottom: 24px; }
    .beat-name {
      font-size: 38px;
      font-weight: 800;
      background: linear-gradient(135deg, #fff 30%, var(--gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }
    .beat-artist { color: var(--text-secondary); font-size: 0.9rem; margin-top: 0.3rem; }
    .beat-artist i { color: var(--gold); margin-right: 0.3rem; }
    .beat-tags {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 4px;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      background: rgba(247, 201, 72, 0.08);
      border: 1px solid rgba(247, 201, 72, 0.15);
      color: rgba(255, 255, 255, 0.7);
      text-transform: uppercase;
    }
    .tag i { font-size: 11px; color: var(--gold); }
    .tag.key-tag { background: rgba(251, 191, 36, 0.08); border-color: rgba(251, 191, 36, 0.15); color: rgba(251, 191, 36, 0.6); }
    .tag.key-tag i { color: #fbbf24; }

    /* PLAYER */
    .player-wrapper {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 16px;
      padding: 18px 20px 16px;
      margin-bottom: 24px;
      border: 1px solid var(--border-color);
    }
    .player-controls {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .play-btn {
      width: 48px;
      height: 48px;
      min-width: 48px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #0a0a0f;
      font-size: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px var(--gold-glow);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .play-btn:hover { transform: scale(1.05); box-shadow: 0 6px 30px var(--gold-glow); }
    .play-btn:active { transform: scale(0.95); }
    .play-btn.playing {
      background: linear-gradient(135deg, #f472b6, #ec4899);
      box-shadow: 0 4px 20px rgba(236, 72, 153, 0.3);
    }
    .player-info { flex: 1; min-width: 0; }
    .player-time {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.3);
      font-weight: 500;
      letter-spacing: 0.5px;
      margin-top: 4px;
    }
    .progress-bar {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 4px;
      cursor: pointer;
      position: relative;
      transition: height 0.2s ease;
    }
    .progress-bar:hover { height: 6px; }
    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 4px;
      background: linear-gradient(90deg, var(--gold), var(--gold-dark));
      transition: width 0.1s linear;
      position: relative;
    }
    .progress-fill::after {
      content: '';
      position: absolute;
      right: -4px;
      top: -4px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--gold);
      opacity: 0;
      transition: opacity 0.2s ease;
      box-shadow: 0 0 20px var(--gold-glow);
    }
    .progress-bar:hover .progress-fill::after { opacity: 1; }

    /* VISUALIZER */
    .visualizer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      height: 30px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border-color);
    }
    .visualizer .bar {
      width: 4px;
      height: 8px;
      background: rgba(247, 201, 72, 0.15);
      border-radius: 2px;
      transition: height 0.15s ease;
    }
    .visualizer.active .bar {
      background: linear-gradient(to top, var(--gold), var(--gold-dark));
      animation: visualize 0.6s ease-in-out infinite alternate;
    }
    .visualizer .bar:nth-child(1) { animation-delay: 0.0s; }
    .visualizer .bar:nth-child(2) { animation-delay: 0.1s; }
    .visualizer .bar:nth-child(3) { animation-delay: 0.2s; }
    .visualizer .bar:nth-child(4) { animation-delay: 0.3s; }
    .visualizer .bar:nth-child(5) { animation-delay: 0.15s; }
    .visualizer .bar:nth-child(6) { animation-delay: 0.05s; }
    .visualizer .bar:nth-child(7) { animation-delay: 0.25s; }
    .visualizer .bar:nth-child(8) { animation-delay: 0.35s; }
    .visualizer .bar:nth-child(9) { animation-delay: 0.1s; }
    .visualizer .bar:nth-child(10) { animation-delay: 0.2s; }
    .visualizer .bar:nth-child(11) { animation-delay: 0.3s; }
    .visualizer .bar:nth-child(12) { animation-delay: 0.05s; }
    .visualizer .bar:nth-child(13) { animation-delay: 0.15s; }
    .visualizer .bar:nth-child(14) { animation-delay: 0.25s; }
    .visualizer .bar:nth-child(15) { animation-delay: 0.35s; }
    @keyframes visualize {
      0% { height: 6px; }
      100% { height: 28px; }
    }
    .visualizer .bar.inactive {
      height: 6px !important;
      animation: none !important;
    }

    /* DOWNLOAD */
    .download-section {
      display: flex;
      gap: 12px;
      margin-bottom: 18px;
    }
    .download-btn {
      flex: 1;
      padding: 14px 8px;
      border: none;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      letter-spacing: 0.5px;
      position: relative;
      overflow: hidden;
    }
    .download-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 14px;
      padding: 2px;
      background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    .btn-mp3 {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #fff;
      box-shadow: 0 4px 20px rgba(245, 158, 11, 0.25);
    }
    .btn-mp3:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(245, 158, 11, 0.35);
    }
    .btn-wav {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: #fff;
      box-shadow: 0 4px 20px rgba(59, 130, 246, 0.25);
    }
    .btn-wav:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(59, 130, 246, 0.35);
    }
    .download-btn:active { transform: scale(0.97); }
    .download-btn i { font-size: 16px; }

    /* MODAL SENHA */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
      animation: fadeIn 0.3s ease;
    }
    .modal-overlay.active { display: flex; }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .modal-box {
      background: var(--bg-secondary);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 40px 35px 35px;
      max-width: 400px;
      width: 100%;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow);
      position: relative;
    }
    .modal-box .modal-icon { text-align: center; font-size: 48px; color: var(--gold); margin-bottom: 12px; }
    .modal-box h3 { color: var(--text-primary); font-size: 22px; font-weight: 700; text-align: center; margin-bottom: 6px; }
    .modal-box p { color: var(--text-muted); font-size: 14px; text-align: center; margin-bottom: 24px; }
    .modal-box .input-group { position: relative; margin-bottom: 20px; }
    .modal-box .input-group i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 18px; }
    .modal-box input[type="password"] {
      width: 100%;
      padding: 14px 16px 14px 48px;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid var(--border-color);
      border-radius: 14px;
      color: var(--text-primary);
      font-size: 16px;
      transition: all 0.3s ease;
      outline: none;
    }
    .modal-box input[type="password"]:focus { border-color: var(--gold); background: rgba(255, 255, 255, 0.08); }
    .modal-box input[type="password"].error { border-color: #ef4444; animation: shake 0.4s ease; }
    .modal-box input[type="password"].success { border-color: #22c55e; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }
    .modal-box .password-actions { display: flex; gap: 10px; }
    .modal-box .password-actions button {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .modal-box .btn-confirm {
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #0a0a0f;
      box-shadow: 0 4px 20px var(--gold-glow);
    }
    .modal-box .btn-confirm:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px var(--gold-glow);
    }
    .modal-box .btn-cancel {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
    }
    .modal-box .btn-cancel:hover { background: rgba(255, 255, 255, 0.08); }
    .modal-box .error-msg {
      color: #ef4444;
      font-size: 12px;
      text-align: center;
      margin-top: 12px;
      min-height: 20px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .modal-box .error-msg.show { opacity: 1; }

    /* FOOTER */
    .footer {
      text-align: center;
      padding-top: 16px;
      border-top: 1px solid var(--border-color);
      margin-top: 4px;
    }
    .footer a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.3s ease;
      letter-spacing: 0.5px;
    }
    .footer a:hover { color: var(--gold); }
    .footer a i { margin-right: 6px; font-size: 12px; }

    /* LOADING */
    .beat-loading { text-align: center; padding: 3rem 2rem; color: var(--text-muted); }
    .beat-loading i { font-size: 2.5rem; color: var(--gold); display: block; margin-bottom: 1rem; }

    /* TOAST */
    .toast-container {
      position: fixed;
      top: 5rem;
      right: 2rem;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      max-width: 420px;
      width: 100%;
      pointer-events: none;
    }
    .toast {
      background: var(--bg-secondary);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 1rem 1.4rem;
      box-shadow: var(--shadow);
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      transform: translateX(120%);
      animation: slideIn 0.4s ease forwards;
      pointer-events: auto;
    }
    .toast.removing { animation: slideOut 0.3s ease forwards; }
    .toast-icon {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      margin-top: 0.1rem;
    }
    .toast-icon.success { background: rgba(37, 211, 102, 0.15); color: #25D366; border: 1px solid rgba(37, 211, 102, 0.2); }
    .toast-icon.error { background: rgba(255, 70, 70, 0.15); color: #ff6b6b; border: 1px solid rgba(255, 70, 70, 0.2); }
    .toast-icon.info { background: var(--gold-glow); color: var(--gold); border: 1px solid var(--border-color); }
    .toast-content { flex: 1; }
    .toast-title { font-weight: 600; font-size: 0.85rem; color: var(--text-primary); margin-bottom: 0.1rem; }
    .toast-message { font-weight: 300; font-size: 0.8rem; color: var(--text-secondary); line-height: 1.4; }
    .toast-close { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.9rem; padding: 0.2rem; transition: 0.2s; flex-shrink: 0; }
    .toast-close:hover { color: var(--text-primary); }
    @keyframes slideIn { to { transform: translateX(0); } }
    @keyframes slideOut { to { transform: translateX(120%); opacity: 0; } }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .beat-card { padding: 24px 18px 20px; border-radius: 24px; margin-top: 70px; }
      .beat-name { font-size: 30px; }
      .cover-wrapper { max-width: 240px; }
      .download-section { flex-direction: column; gap: 8px; }
      .download-btn { padding: 16px; }
      .modal-box { padding: 30px 20px 25px; }
      .player-controls { gap: 12px; }
      .play-btn { width: 42px; height: 42px; min-width: 42px; font-size: 17px; }
      .tag { font-size: 10px; padding: 3px 10px; }
      .visualizer .bar { width: 3px; }
      .toast-container { right: 1rem; left: 1rem; max-width: none; top: 4.5rem; }
      .site-header { padding: 0.5rem 1rem; }
      .site-header .logo-area .brand { font-size: 1rem; }
      .site-header .nav-links a { font-size: 0.75rem; padding: 0.2rem 0.6rem; }
      .site-header .nav-links a span { display: none; }
    }
    @media (max-width: 480px) {
      .beat-card { padding: 18px 12px 16px; }
      .beat-name { font-size: 26px; }
      .cover-wrapper { max-width: 180px; }
      .tag { font-size: 9px; padding: 2px 8px; }
      .site-header .logo-area img { width: 30px; height: 30px; }
      .site-header .logo-area .brand { font-size: 0.9rem; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header class="site-header">
  <a href="/" class="logo-area">
    <img src="logo.png" alt="Beatsao">
    <span class="brand">Beatsao</span>
  </a>
  <div class="nav-links">
    <a href="/" class="back-btn"><i class="fas fa-arrow-left"></i> <span>Voltar</span></a>
    <a href="/"><i class="fas fa-music"></i> <span>Beats</span></a>
  </div>
</header>

<!-- TOAST -->
<div class="toast-container" id="toastContainer"></div>

<!-- BEAT CARD -->
<div class="beat-card">
  <div id="beatContent">
    <div class="beat-loading">
      <i class="fas fa-spinner fa-spin"></i>
      <p>Carregando beat...</p>
    </div>
  </div>
</div>

<!-- MODAL SENHA -->
<div class="modal-overlay" id="passwordModal">
  <div class="modal-box">
    <div class="modal-icon"><i class="fas fa-lock"></i></div>
    <h3>Download Protegido</h3>
    <p>Digite a senha para liberar o download</p>
    <div class="input-group">
      <i class="fas fa-key"></i>
      <input type="password" id="passwordInput" placeholder="Digite a senha" autocomplete="off">
    </div>
    <div class="password-actions">
      <button class="btn-cancel" id="modalCancel">Cancelar</button>
      <button class="btn-confirm" id="modalConfirm">Confirmar</button>
    </div>
    <div class="error-msg" id="errorMsg">Senha incorreta. Tente novamente.</div>
  </div>
</div>

<script>
  // ============================================================
  // CONFIGURAÇÃO
  // ============================================================
  const SUPABASE_URL = 'https://bbghffltmiqcljuokbgz.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJiZ2hmZmx0bWlxY2xqdW9rYmd6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2NzIyODgsImV4cCI6MjEwMDI0ODI4OH0.n1mYWDG2803VEbGQ8qyWlCkthtezu-3Yuh-k58bo0xE';

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ============================================================
  // PEGAR SLUG DA URL
  // ============================================================
  function getBeatSlug() {
    const path = window.location.pathname;
    const parts = path.split('/');
    const lastPart = parts[parts.length - 1];
    if (lastPart && lastPart !== 'beat' && lastPart !== '') {
      return lastPart;
    }
    const params = new URLSearchParams(window.location.search);
    return params.get('beat') || 'love';
  }

  const beatSlug = getBeatSlug();
  console.log('🔍 Slug detectado:', beatSlug);

  // ============================================================
  // TOAST
  // ============================================================
  function showToast(title, message, type = 'info', duration = 4000) {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = 'toast';
    const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', info: 'fa-info-circle' };
    toast.innerHTML = `
      <div class="toast-icon ${type}"><i class="fas ${icons[type] || icons.info}"></i></div>
      <div class="toast-content"><div class="toast-title">${title}</div><div class="toast-message">${message}</div></div>
      <button class="toast-close"><i class="fas fa-times"></i></button>
    `;
    container.appendChild(toast);
    const closeBtn = toast.querySelector('.toast-close');
    closeBtn.addEventListener('click', () => removeToast(toast));
    if (duration > 0) setTimeout(() => removeToast(toast), duration);
    return toast;
  }
  function removeToast(toast) {
    if (toast.classList.contains('removing')) return;
    toast.classList.add('removing');
    setTimeout(() => { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 350);
  }

  // ============================================================
  // CARREGAR BEAT DO SUPABASE - COM FALLBACK E LOGS
  // ============================================================
async function loadBeat() {
    try {
        console.log('📡 Buscando beat: slug=' + beatSlug);
        
        // Buscar o beat pelo slug
        const { data, error } = await supabase
            .from('beats')
            .select('*')
            .eq('slug', beatSlug)
            .single();

        if (error || !data) {
            console.error('❌ Beat não encontrado:', error);
            document.getElementById('beatContent').innerHTML = `
                <div class="beat-loading">
                    <i class="fas fa-exclamation-triangle" style="color:#ff6b6b;"></i>
                    <p>Beat não encontrado: "${beatSlug}"</p>
                    <p style="font-size:0.8rem;margin-top:0.5rem;color:var(--text-muted);">
                        Verifique se o slug está correto.
                    </p>
                    <p style="font-size:0.8rem;margin-top:0.3rem;">
                        <a href="/" style="color:var(--gold);text-decoration:none;">Voltar para a lista</a>
                    </p>
                </div>
            `;
            return;
        }

        const beat = data;
        console.log('✅ Beat encontrado:', beat.title);
        console.log('📊 Áudio:', beat.audio);
        
        document.title = `${beat.title} - Beatsao`;
        renderBeat(beat);
    } catch (error) {
        console.error('❌ Erro:', error);
        document.getElementById('beatContent').innerHTML = `
            <div class="beat-loading">
                <i class="fas fa-exclamation-triangle" style="color:#ff6b6b;"></i>
                <p>Erro ao carregar o beat</p>
                <p style="font-size:0.8rem;margin-top:0.3rem;">
                    <a href="/" style="color:var(--gold);text-decoration:none;">Voltar para a lista</a>
                </p>
            </div>
        `;
    }
}

  // ============================================================
  // RENDERIZAR BEAT - COM FALLBACKS PARA DADOS FALTANDO
  // ============================================================
  function renderBeat(beat) {
    console.log('🎨 Renderizando beat...');
    
    // Garantir que todos os campos existem
    const title = beat.title || 'Beat sem nome';
    const artist = beat.artist || 'Produtor';
    const genre = beat.genre || 'Afro';
    const bpm = beat.bpm || '--';
    const key = beat.key || 'em breve';
    const price = beat.price || 'Kz 0';
    const cover = beat.cover || null;
    const audio = beat.audio || null;

    console.log('🎵 Áudio:', audio);

    const html = `
      <!-- CAPA -->
      <div class="cover-wrapper">
        <div class="cover-glow"></div>
        ${cover ? 
          `<img src="${cover}" alt="${title}">` :
          `<div class="cover-placeholder">
            <div class="icon-big">♫</div>
            <div class="title-art">${title.toUpperCase()}</div>
            <div class="sub-art">${genre}</div>
          </div>`
        }
      </div>

      <!-- INFORMAÇÕES -->
      <div class="beat-info">
        <div class="beat-name">${title}</div>
        <div class="beat-artist"><i class="fas fa-user"></i> ${artist}</div>
        <div class="beat-tags">
          <span class="tag"><i class="fas fa-music"></i> ${genre}</span>
          <span class="tag"><i class="fas fa-tachometer-alt"></i> ${bpm} BPM</span>
          <span class="tag key-tag"><i class="fas fa-key"></i> ${key}</span>
          <span class="tag"><i class="fas fa-coins"></i> ${price}</span>
        </div>
      </div>

      <!-- PLAYER -->
      <div class="player-wrapper">
        <div class="player-controls">
          <button class="play-btn" id="playBtn" aria-label="Play/Pause">
            <i class="fas fa-play"></i>
          </button>
          <div class="player-info">
            <div class="progress-bar" id="progressBar">
              <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="player-time">
              <span id="currentTime">0:00</span>
              <span id="totalTime">0:00</span>
            </div>
          </div>
        </div>

        <!-- VISUALIZER -->
        <div class="visualizer" id="visualizer">
          ${Array(15).fill(0).map(() => `<div class="bar inactive"></div>`).join('')}
        </div>
      </div>

      <!-- DOWNLOADS -->
      <div class="download-section">
        <button class="download-btn btn-mp3" data-format="mp3" data-beat-id="${beat.id}">
          <i class="fas fa-file-audio"></i> MP3
        </button>
        <button class="download-btn btn-wav" data-format="wav" data-beat-id="${beat.id}">
          <i class="fas fa-file-audio"></i> WAV
        </button>
      </div>

      <!-- FOOTER -->
      <div class="footer">
        <a href="https://beatsao.site" target="_blank">
          <i class="fas fa-globe"></i> beatsao.site
        </a>
      </div>
    `;

    document.getElementById('beatContent').innerHTML = html;
    console.log('✅ Beat renderizado com sucesso!');

    // Inicializar player se tiver áudio
    if (audio) {
      console.log('🎵 Inicializando player com áudio:', audio);
      initializePlayer(audio);
    } else {
      console.warn('⚠️ Beat sem áudio - player não será funcional');
      // Mostra um aviso no player
      const playBtn = document.getElementById('playBtn');
      if (playBtn) {
        playBtn.style.opacity = '0.5';
        playBtn.style.cursor = 'not-allowed';
        playBtn.title = 'Áudio indisponível';
      }
    }

    // Inicializar download
    initializeDownload(beat);
  }

  // ============================================================
  // PLAYER
  // ============================================================
  function initializePlayer(audioUrl) {
    try {
      const audio = new Audio(audioUrl);
      const playBtn = document.getElementById('playBtn');
      const progressFill = document.getElementById('progressFill');
      const progressBar = document.getElementById('progressBar');
      const currentTimeEl = document.getElementById('currentTime');
      const totalTimeEl = document.getElementById('totalTime');
      const visualizer = document.getElementById('visualizer');
      const bars = visualizer?.querySelectorAll('.bar') || [];

      let isDragging = false;

      function formatTime(seconds) {
        if (isNaN(seconds)) return '0:00';
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return m + ':' + (s < 10 ? '0' : '') + s;
      }

      function updateProgress() {
        if (!isDragging && audio.duration) {
          const percent = (audio.currentTime / audio.duration) * 100 || 0;
          progressFill.style.width = percent + '%';
          currentTimeEl.textContent = formatTime(audio.currentTime);
        }
      }

      audio.addEventListener('loadedmetadata', () => {
        totalTimeEl.textContent = formatTime(audio.duration);
      });

      audio.addEventListener('timeupdate', updateProgress);

      if (playBtn) {
        playBtn.addEventListener('click', () => {
          if (audio.paused) {
            audio.play().catch(() => console.warn('Erro ao reproduzir áudio'));
          } else {
            audio.pause();
          }
        });
      }

      audio.addEventListener('play', () => {
        if (playBtn) {
          playBtn.innerHTML = '<i class="fas fa-pause"></i>';
          playBtn.classList.add('playing');
        }
        if (visualizer) {
          visualizer.classList.add('active');
          bars.forEach(b => b.classList.remove('inactive'));
        }
      });

      audio.addEventListener('pause', () => {
        if (playBtn) {
          playBtn.innerHTML = '<i class="fas fa-play"></i>';
          playBtn.classList.remove('playing');
        }
        if (visualizer) {
          visualizer.classList.remove('active');
          bars.forEach(b => b.classList.add('inactive'));
        }
      });

      audio.addEventListener('ended', () => {
        if (playBtn) {
          playBtn.innerHTML = '<i class="fas fa-play"></i>';
          playBtn.classList.remove('playing');
        }
        if (visualizer) {
          visualizer.classList.remove('active');
          bars.forEach(b => b.classList.add('inactive'));
        }
        if (progressFill) {
          progressFill.style.width = '0%';
          currentTimeEl.textContent = '0:00';
        }
      });

      if (progressBar) {
        progressBar.addEventListener('click', (e) => {
          const rect = progressBar.getBoundingClientRect();
          const percent = (e.clientX - rect.left) / rect.width;
          audio.currentTime = percent * audio.duration;
        });

        progressBar.addEventListener('mousedown', (e) => {
          isDragging = true;
          const rect = progressBar.getBoundingClientRect();
          const percent = (e.clientX - rect.left) / rect.width;
          audio.currentTime = percent * audio.duration;
          updateProgress();

          const onMove = (ev) => {
            const r = progressBar.getBoundingClientRect();
            let p = (ev.clientX - r.left) / r.width;
            p = Math.max(0, Math.min(1, p));
            audio.currentTime = p * audio.duration;
            progressFill.style.width = (p * 100) + '%';
            currentTimeEl.textContent = formatTime(audio.currentTime);
          };

          const onUp = () => {
            isDragging = false;
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onUp);
          };

          document.addEventListener('mousemove', onMove);
          document.addEventListener('mouseup', onUp);
        });
      }

      console.log('✅ Player inicializado com sucesso');
    } catch (error) {
      console.error('❌ Erro ao inicializar player:', error);
    }
  }

  // ============================================================
  // DOWNLOAD COM SENHA
  // ============================================================
  function initializeDownload(beat) {
    let selectedFormat = null;

    const modal = document.getElementById('passwordModal');
    const passwordInput = document.getElementById('passwordInput');
    const errorMsg = document.getElementById('errorMsg');
    const modalConfirm = document.getElementById('modalConfirm');
    const modalCancel = document.getElementById('modalCancel');

    document.querySelectorAll('.download-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        selectedFormat = btn.dataset.format;
        passwordInput.value = '';
        passwordInput.className = '';
        errorMsg.classList.remove('show');
        modal.classList.add('active');
        setTimeout(() => passwordInput.focus(), 100);
      });
    });

    async function confirmPassword() {
      const password = passwordInput.value.trim();

      if (!password) {
        errorMsg.textContent = 'Digite a senha primeiro';
        errorMsg.classList.add('show');
        passwordInput.className = 'error';
        setTimeout(() => {
          passwordInput.className = '';
          errorMsg.classList.remove('show');
        }, 2000);
        return;
      }

      try {
        console.log('🔐 Verificando senha para:', beatSlug);
        
        const response = await fetch('/api/download', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            password: password,
            format: selectedFormat,
            beatSlug: beatSlug
          })
        });

        const data = await response.json();
        console.log('📦 Resposta da API:', data);

        if (data.success) {
          passwordInput.className = 'success';
          errorMsg.classList.remove('show');

          const link = document.createElement('a');
          link.href = data.url;
          link.download = data.filename;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);

          setTimeout(() => {
            modal.classList.remove('active');
            passwordInput.className = '';
          }, 500);

        } else {
          passwordInput.className = 'error';
          errorMsg.textContent = data.error || 'Senha incorreta';
          errorMsg.classList.add('show');
          passwordInput.value = '';
          setTimeout(() => passwordInput.focus(), 100);

          setTimeout(() => {
            passwordInput.className = '';
          }, 2000);
        }
      } catch (error) {
        console.error('❌ Erro na requisição:', error);
        errorMsg.textContent = 'Erro de conexão. Tente novamente.';
        errorMsg.classList.add('show');
        passwordInput.className = 'error';
        setTimeout(() => {
          passwordInput.className = '';
          errorMsg.classList.remove('show');
        }, 3000);
      }
    }

    if (modalConfirm) modalConfirm.addEventListener('click', confirmPassword);
    if (passwordInput) {
      passwordInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') confirmPassword();
      });
    }
    if (modalCancel) {
      modalCancel.addEventListener('click', () => {
        modal.classList.remove('active');
        passwordInput.className = '';
        errorMsg.classList.remove('show');
      });
    }
    if (modal) {
      modal.addEventListener('click', (e) => {
        if (e.target === modal) {
          modal.classList.remove('active');
          passwordInput.className = '';
          errorMsg.classList.remove('show');
        }
      });
    }
  }

  // ============================================================
  // INICIAR
  // ============================================================
  console.log('🚀 Iniciando beat.html...');
  loadBeat();
</script>
</body>
</html>
